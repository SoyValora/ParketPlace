<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body>

<div class="d-flex">
    <!-- Barra lateral -->
    <div id="sidebar" class="bg-dark text-white p-3">
        <button id="toggle-btn" class="toggle-btn">
            <i class="bi bi-chevron-left"></i>
        </button>
        <h4 class="sidebar-text">ParketPlace</h4>
        <p class="sidebar-text text-muted">Posible Publicidad</p>
    </div>

    <!-- Contenido principal -->
    <div class="container-fluid p-4">
        <!-- Navbar superior -->
        <nav class="navbar navbar-light bg-light d-flex justify-content-between">
            <span class="navbar-brand">ParketPlace</span>
            <div>
                <span class="me-3" id="username">Cargando...</span>
                <button id="user-btn" class="btn btn-light"><i class="bi bi-person-circle"></i></button>
                <button id="notif-btn" class="btn btn-light"><i class="bi bi-bell"></i></button>
            </div>
        </nav>

        <!-- Sección bienvenida -->
        <div class="mt-3">
            <h3>Bienvenid@, <span class="fw-bold" id="user-name-display">Cargando...</span></h3>
        </div>

        <!-- Sección Pico y Placa -->
        <div class="card mt-3 p-3">
            <h5>Pico y Placa de Hoy</h5>
            <div class="d-flex align-items-center">
                <input type="checkbox" class="form-check-input me-2">
                <input type="checkbox" class="form-check-input me-2">
                <span class="ms-3">Desde las 5 AM hasta las 8 PM</span>
            </div>
        </div>

        <!-- Alertas de vencimiento -->
        <div class="card mt-3 p-3">
            <h5>Alertas</h5>
            <p>SOAT vence el día: <span class="text-danger fw-bold">XX/XX/XXXX</span></p>
            <p>Techo vence el día: <span class="text-danger fw-bold">XX/XX/XXXX</span></p>
        </div>

        <!-- Pie de página -->
        <footer class="mt-4 text-center">
            <p>Parket Place - IUSH | <i class="bi bi-chat-square-text"></i> Comentarios</p>
        </footer>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
