<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='stylelogin.css') }}">
</head>
<body>
<div class="container-fluid vh-100">
    <div class="row h-100">
        <!-- Columna izquierda -->
        <div class="col-md-6 d-flex justify-content-center align-items-center bg-light">
            <div class="card p-4 text-center">
                <!-- Logo -->
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="img-fluid mb-3" style="max-width: 150px;">

                <!-- Título -->
                <h3>ParketPlace</h3>

                {% if error %}
                    <div class="alert alert-danger text-center">{{ error }}</div>
                {% endif %}

                <!-- Formulario -->
                <form method="POST">
                    <div class="mb-3">
                        <input type="text" class="form-control" name="usuario" placeholder="Usuario" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" class="form-control" name="contrasena" placeholder="Contraseña" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
                </form>
                <a href="{{ url_for('register') }}" class="btn btn-secondary w-100 mt-2">Registrarse</a>
            </div>
        </div>

        <!-- Columna derecha -->
        <div class="col-md-6 bg-image"></div>
    </div>
</div>
</body>
</html>
