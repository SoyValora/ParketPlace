<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ParketPlace</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="{{ url_for('static', filename='stylelogin.css') }}">
</head>
<body class="d-flex justify-content-center align-items-center bg-dark" style="height: 100vh;">

    <div class="card p-4 text-center">

        <!-- Título -->
        <h3 class="mb-3 text-white">ParketPlace</h3>

        <!-- Mensaje de error -->
        {% if error %}
            <div class="alert alert-danger text-center">{{ error }}</div>
        {% endif %}

        <!-- Formulario de inicio de sesión -->
        <form method="POST">
            <div class="mb-3">
                <input type="text" class="form-control" name="usuario" placeholder="Usuario" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" name="contrasena" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
        </form>

        <!-- Botón de registro -->
        <a href="{{ url_for('register') }}" class="btn btn-secondary w-100 mt-2">Registrarse</a>
    </div>
</body>
</html>
