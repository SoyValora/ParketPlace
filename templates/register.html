<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styleregister.css') }}">
</head>
<body>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap');
    </style>
    <div class="card">
        <h2>Regístrate</h2>
        <!-- Mostrar mensaje de éxito o error -->
        {% if mensaje %}
            <div class="alert">
                <p>{{ mensaje }}</p>
            </div>
        {% endif %}
 
        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-grid">
                <div class="form-group">
                    <label for="nombres">Nombres:</label>
                    <input type="text" id="nombres" name="nombres" required>
                </div>
                <div class="form-group">
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" id="apellidos" name="apellidos" required>
                </div>
                <div class="form-group">
                    <label for="documentoIdent">Documento de Identidad:</label>
                    <input type="text" id="documentoIdent" name="documentoIdent" required>
                </div>
                <div class="form-group">
                    <label for="codUniversidad">Código Universidad:</label>
                    <input type="text" id="codUniversidad" name="codUniversidad" required>
                </div>
                <div class="form-group">
                    <label for="email">Correo Institucional:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="programa">Programa:</label>
                    <input type="text" id="programa" name="programa" required>
                </div>
                <div class="form-group">
                    <label for="fechaNacimiento">Fecha de Nacimiento:</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
                </div>
                <div class="form-group">
                    <label for="celular">Celular:</label>
                    <input type="tel" id="celular" name="celular" required>
                </div>
            </div>
            <button type="submit">Registrarse</button>
            <a href="{{ url_for('login') }}" class="btn-secondary">← Volver</a>
        </form>
    </div>
</body>
</html>
