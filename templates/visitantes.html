<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso Visitantes - ParketPlace</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="{{ url_for('static', filename='stylevisiter.css') }}">
</head>
<body>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap');
    </style>
    <div class="container-fluid vh-100 d-flex align-items-center justify-content-center">
        <div class="card p-4">
            <!-- Título -->
            <h2 class="text-center mb-4">Pago Visitantes</h2>

            <!-- Formulario -->
            <form method="POST" action="{{ url_for('visitor_register') }}">
                <div class="row">
                    <!-- Lado izquierdo -->
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="placa" class="form-label">Ingrese Placa</label>
                            <input type="text" id="placa" name="placa" class="form-control" placeholder="Placa del vehículo" required>
                        </div>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Nombre completo" required>
                        </div>
                        <div class="mb-3">
                            <label for="apellido" class="form-label">Apellido</label>
                            <input type="text" id="apellido" name="apellido" class="form-control" placeholder="Apellido completo" required>
                        </div>
                        <div class="mb-3">
                            <label for="valor" class="form-label">Valor a Pagar</label>
                            <input type="text" id="valor" name="valor" class="form-control" placeholder="Valor a pagar" required oninput="formatearValor()">
                        </div>
                    </div>

                    <!-- Lado derecho -->
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="opciones_pago" class="form-label">Opciones de Pago</label>
                            <div>
                                <label class="form-check-label">
                                    <input type="radio" class="form-check-input" name="pago" value="PSE" required> PSE
                                </label>
                            </div>
                            <div>
                                <label class="form-check-label">
                                    <input type="radio" class="form-check-input" name="pago" value="Bancolombia"> Bancolombia
                                </label>
                            </div>
                            <div>
                                <label class="form-check-label">
                                    <input type="radio" class="form-check-input" name="pago" value="TarjetaCredito"> Tarjeta de Crédito
                                </label>
                            </div>
                            <div>
                                <label class="form-check-label">
                                    <input type="radio" class="form-check-input" name="pago" value="Nequi"> Nequi
                                </label>
                            </div>
                            <div>
                                <label class="form-check-label">
                                    <input type="radio" class="form-check-input" name="pago" value="Efecty"> Efecty
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Pagar</button>
                <a href="{{ url_for('login') }}" class="btn btn-secondary w-100 mt-2">← Volver</a>
            </form>
        </div>
    </div>

    <!-- JavaScript para formatear el valor -->
    <script>
        function formatearValor() {
            var valor = document.getElementById('valor').value;
            // Eliminar cualquier carácter no numérico
            valor = valor.replace(/\D/g, '');

            // Agregar puntos como separadores de miles
            valor = valor.replace(/\B(?=(\d{3})+(?!\d))/g, ".");

            // Añadir el signo de pesos
            document.getElementById('valor').value = '$' + valor;
        }
    </script>
</body>
</html>
